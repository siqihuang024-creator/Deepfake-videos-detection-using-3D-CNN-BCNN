# Stage A on DFD: whole frame, native resolution, decimated 2x on both axes.
#
# Every DFD video is 1920x1080, so decimation gives a uniform 960x540 with the
# aspect ratio held. No detector runs, no resampling happens anywhere in the
# path, and the surviving pixels keep their original values -- which is the
# point. The letterbox run this replaces went through cv2.INTER_AREA, a
# low-pass filter that averaged 4.6 input pixels into each output pixel, and
# manipulation traces are high-frequency.
#
# What this does NOT fix: the face still spans 1.8 of the 22x22 feature grid,
# 1.2% of it, exactly as in the failed run. Decimation scales the face and the
# frame together, so the ratio cannot move. If training loss again refuses to
# fall below ln 2 = 0.6931, dilution is the remaining explanation and the
# face-crop control is the next run.
seed: 42
device: cuda

data:
  active_datasets: [DFD]
  dataset_roots:
    DFD: E:/PhD/Deepfake Video TCN+BCNN/Datasets/DFD-Kaggle
    CelebDFv3: E:/PhD/Deepfake Video TCN+BCNN/Datasets/CelebDFv3/CelebDFv3

  frame_mode: decimate
  decimate_step: 2
  face_crop: false

  # 'max' means the largest balance group, which for supervised Stage A is
  # the fake pool -- 28150 clips per class per epoch on CelebDFv3. The
  # whole-frame runs used 1000, and every training video still stays in
  # the pool; a smaller budget just means more epochs see more of it.
  train_samples_per_dataset_per_epoch: 1000
  clip_length: 8
  train_clip_strides: [1, 2]
  selection_clips_per_video: 4
  eval_clips_per_video: 8
  eval_clip_stride: 2
  # DFD's strict-donor validation split holds 45 real and 17 fake videos, so
  # nothing here should be truncated further.
  selection_max_fakes_per_dataset: 1000

  horizontal_flip_probability: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  num_workers: 2

model:
  architecture: 3d
  # Unused in this mode: nothing is resized or centre-cropped. AdaptiveAvgPool2d
  # holds feature_dim at 15488 whatever the input size, so the extractor this
  # produces still hands Stage B the same vector the CelebDFv3 one does.
  input_resize: 256
  center_crop: 256
  # build_model defaults to activation='sigmoid', norm='none' -- the
  # pre-v9 architecture. Three conv3d layers behind sigmoid barely pass a
  # gradient to the first one; v9 reached 0.7774 only after relu and batch
  # norm, and every run since has carried both on the command line. Written
  # here so a run that omits the flags still gets the architecture we mean.
  activation: relu
  norm: batch
  conv_channels: [16, 24, 32]
  spatial_kernel_size: 5
  temporal_kernel_size: 3
  spatial_pool_kernel_size: 4
  spatial_pool_stride: 2
  feature_dim: 15488
  hidden_dim: 512
  dropout: 0.2
  prior_std: 0.1
  posterior_rho_init: -5.0
  observation_std: 1.0

train:
  epochs: 60
  physical_batch_size: 1
  learning_rate: 0.0001
  momentum: 0.9
  gradient_clip_norm: 5.0
  lr_gamma: 0.95
  lr_step_interval: 1
  kl_weight: 0.001
  report_mc_uncertainty_samples: 0
  calibration_false_positive_rate: 0.05
  selection_metric: macro_dataset_auroc
  selection_min_metric_improvement: 0.002
  # 17 validation fakes cannot rank a checkpoint reliably, so selection leans
  # on a long patience rather than on small AUROC moves.
  early_stopping_patience: 12
  checkpoint_dir: artifacts/run_stage_a_dfd_decimate/checkpoints
  log_dir: artifacts/run_stage_a_dfd_decimate/logs
  report_dir: artifacts/run_stage_a_dfd_decimate/reports
