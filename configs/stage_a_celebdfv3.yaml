# Stage A on CelebDFv3: tracked face box expanded x2.0, resampled to 256x256.
#
# face_margin is a per-side fraction and the crop spans (1 + 2m) box widths, so
# 0.50 gives x2.0. Every run from v9 to v15 used 0.25, which is x1.5, not the
# x1.3 those runs claimed.
#
# Why x2.0 rather than the x1.3 of FF++ / DeepfakeBench: the measured median
# face box on CelebDFv3 is 129.4 px (RetinaFace 129.4, MTCNN 128.0). At x1.3 a
# 256 canvas would stretch that to 197 px, a 1.52x upsample that invents
# pixels and blurs exactly the high-frequency evidence we are after. At x2.0
# the face lands on 128 px -- a resampling factor of 0.99, so its pixels pass
# through untouched -- and the crop still gains a ring of neck, shoulders and
# hair. x1.3 stays available as the protocol-comparable ablation.
#
# Re-derive the margin once dlib is installed: it reports wider boxes than
# RetinaFace (Haar ran +24%), and the right value is 256 / median box width.
seed: 42
device: cuda

data:
  active_datasets: [CelebDFv3]
  dataset_roots:
    DFD: E:/PhD/Deepfake Video TCN+BCNN/Datasets/DFD-Kaggle
    CelebDFv3: E:/PhD/Deepfake Video TCN+BCNN/Datasets/CelebDFv3/CelebDFv3

  frame_mode: face
  face_crop: true
  face_margin: 0.50
  # Off-centre faces are common (16% of CelebDFv3 faces sit more than 30% off
  # centre) and a wide margin makes edge overrun the rule rather than the
  # exception. Clamping would return a rectangle that the later resize then
  # trims asymmetrically, undoing the scale normalisation the crop exists for.
  crop_padding: replicate
  face_detector_scale_factor: 1.1
  face_detector_min_neighbors: 5
  box_smoothing_alpha: 0.6

  # 'max' means the largest balance group, which for supervised Stage A is
  # the fake pool -- 28150 clips per class per epoch on CelebDFv3. The
  # whole-frame runs used 1000, and every training video still stays in
  # the pool; a smaller budget just means more epochs see more of it.
  train_samples_per_dataset_per_epoch: 1000
  clip_length: 8
  train_clip_strides: [1, 2]
  selection_clips_per_video: 4
  eval_clips_per_video: 8
  eval_clip_stride: 2
  selection_max_fakes_per_dataset: 1000

  horizontal_flip_probability: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  num_workers: 2

model:
  architecture: 3d
  # 256/256 so CenterCrop is a no-op and the square crop reaches the network
  # whole. DeepfakeBench Sec. 4.1 specifies 256x256.
  input_resize: 256
  center_crop: 256
  conv_channels: [16, 24, 32]
  spatial_kernel_size: 5
  temporal_kernel_size: 3
  spatial_pool_kernel_size: 4
  spatial_pool_stride: 2
  feature_dim: 15488
  hidden_dim: 512
  dropout: 0.2
  prior_std: 0.1
  posterior_rho_init: -5.0
  observation_std: 1.0

train:
  epochs: 60
  physical_batch_size: 1
  learning_rate: 0.0001
  momentum: 0.9
  gradient_clip_norm: 5.0
  lr_gamma: 0.95
  lr_step_interval: 1
  kl_weight: 0.001
  report_mc_uncertainty_samples: 0
  calibration_false_positive_rate: 0.05
  selection_metric: macro_dataset_auroc
  selection_min_metric_improvement: 0.002
  early_stopping_patience: 8
  checkpoint_dir: artifacts/run_stage_a_celebdfv3_face/checkpoints
  log_dir: artifacts/run_stage_a_celebdfv3_face/logs
  report_dir: artifacts/run_stage_a_celebdfv3_face/reports
