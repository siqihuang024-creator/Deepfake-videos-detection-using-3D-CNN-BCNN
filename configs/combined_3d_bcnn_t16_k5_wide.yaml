# Wider/longer temporal ablation after the T8/K3 combined run collapsed.
seed: 42
device: cuda

data:
  active_datasets: [DFD, CelebDFv3]
  dataset_roots:
    DFD: E:/PhD/Deepfake Video TCN+BCNN/Datasets/DFD-Kaggle
    CelebDFv3: E:/PhD/Deepfake Video TCN+BCNN/Datasets/CelebDFv3/CelebDFv3

  # Two clips per CelebDFv3 video and about 4.6 clips per DFD video per epoch.
  # Domain balancing keeps DFD from being diluted by the larger CelebDFv3 pool.
  train_samples_per_dataset_per_epoch: 1226
  clip_length: 16
  train_clip_strides: [1, 2]
  selection_clips_per_video: 4
  eval_clips_per_video: 8
  eval_clip_stride: 2
  selection_max_fakes_per_dataset: 64

  face_crop: true
  face_margin: 0.25
  face_detector_scale_factor: 1.1
  face_detector_min_neighbors: 5
  box_smoothing_alpha: 0.6
  horizontal_flip_probability: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  num_workers: 2

model:
  architecture: 3d
  input_resize: 256
  center_crop: 224
  # Widen the hidden convolutional stages while retaining the 32-channel output.
  conv_channels: [24, 32, 32]
  spatial_kernel_size: 5
  temporal_kernel_size: 5
  spatial_pool_kernel_size: 4
  spatial_pool_stride: 2
  feature_dim: 15488
  hidden_dim: 512
  dropout: 0.2
  prior_std: 0.1
  posterior_rho_init: -5.0
  observation_std: 1.0

train:
  epochs: 100
  physical_batch_size: 1
  learning_rate: 0.00005
  momentum: 0.9
  gradient_clip_norm: 5.0
  # Slower decay keeps the reduced learning rate useful during a longer run.
  lr_gamma: 0.98
  lr_step_interval: 1
  kl_weight: 0.001
  report_mc_uncertainty_samples: 0
  calibration_false_positive_rate: 0.05
  selection_metric: macro_dataset_auroc
  selection_min_metric_improvement: 0.002
  early_stopping_patience: 15
  checkpoint_dir: artifacts/run_3d_bcnn_t16_k5_wide_combined/checkpoints
  log_dir: artifacts/run_3d_bcnn_t16_k5_wide_combined/logs
  report_dir: artifacts/run_3d_bcnn_t16_k5_wide_combined/reports
